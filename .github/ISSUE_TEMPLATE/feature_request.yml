name: Feature request
description: Propose a Linux integration or packaging improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: use_case
    attributes:
      label: Use case
      description: Describe the user problem, distribution, desktop, or architecture involved.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
      description: Include security, maintenance, and redistribution considerations.
    validations:
      required: true
  - type: checkboxes
    id: boundaries
    attributes:
      label: Project boundaries
      options:
        - label: This proposal does not require redistributing OpenAI proprietary assets or weakening a security boundary.
          required: true
